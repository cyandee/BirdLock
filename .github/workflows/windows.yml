name: Windows package checks

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version assertion; must match VERSION"
        default: ""
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt -c windows/constraints-release.txt pyinstaller

      - name: Version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION" }
          $requested = $env:REQUESTED_VERSION
          if ($requested -and $requested -ne $v) { throw "Version does not match VERSION" }
          if ($env:BUILD_REF.StartsWith("refs/tags/") -and $env:BUILD_TAG -notmatch "^v$([regex]::Escape($v))(-[0-9A-Za-z.-]+)?$") {
            throw "Tag does not match VERSION"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build portable package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python windows/build_windows.py --version ${{ steps.ver.outputs.version }}

      - name: Unit tests
        env:
          PYTHONPATH: windows
        run: python -m unittest discover -s windows/tests -p "test_*.py"

      - name: Independent updater verification
        run: |
          $csc = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          $refs = @('/reference:System.Web.Extensions.dll', '/reference:System.IO.Compression.dll', '/reference:System.IO.Compression.FileSystem.dll')
          & $csc /nologo /codepage:65001 /optimize+ /target:exe /platform:x64 /out:windows/updater/dist/UpdaterTests.exe @refs windows/updater/Updater.cs windows/updater/Tests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests did not compile' }
          & windows/updater/dist/UpdaterTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          & $csc /nologo /codepage:65001 /optimize+ /target:exe /platform:x64 /main:IntegrationTests /out:windows/updater/dist/IntegrationTests.exe @refs windows/updater/Updater.cs windows/updater/fixtures/IntegrationTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Updater integration tests did not compile' }
          & windows/updater/dist/IntegrationTests.exe "$PWD/windows/updater"
          if ($LASTEXITCODE -ne 0) { throw 'Updater integration tests failed' }

      - name: Self-test from source (CPU / DirectML, FFmpeg)
        working-directory: windows
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m birdlock.cli devices
          python -m birdlock.cli selftest

      - name: Self-test of the packaged exe
        run: |
          $exe = "windows/dist/BirdLock/BirdLock.exe"
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content windows/dist/BirdLock/data/selftest.log
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
          $p = Start-Process $exe -ArgumentList "--smoketest" -Wait -PassThru
          Get-Content windows/dist/BirdLock/data/smoketest.log
          if ($p.ExitCode -ne 0) { throw "smoketest failed ($($p.ExitCode))" }
          if (-not (Test-Path windows/dist/BirdLock/data/smoketest.png)) { throw "smoketest produced no screenshot" }

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: windows/dist/BirdLock-*-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: smoketest-screenshot
          path: windows/dist/BirdLock/data/smoketest.png
