[package]
name = "birdlock-telemetry"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "19bc11f8c13eaa07ec1988bf0a55884f3fcc0f96" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base91 = "0.1.0"
flate2 = "1.1"
bincode = { version = "2.0", features = ["serde"] }
ciborium = "0.2"
csv = "1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

